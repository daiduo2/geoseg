[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoseg"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.0",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "scikit-learn>=1.0",
    "opencv-python-headless>=4.0",
]

[project.scripts]
geoseg-preprocess-artifact = "geoseg.cli.preprocess_artifact:main"

[project.optional-dependencies]
pdf = [
    "pymupdf>=1.24",
]
vlm = [
    "requests>=2.31",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
gui = [
    "napari>=0.5",
    "PySide6>=6.6",
]
full = [
    "fastapi>=0.110",
    "napari>=0.5",
    "pymupdf>=1.24",
    "PySide6>=6.6",
    "requests>=2.31",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "geoseg.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
