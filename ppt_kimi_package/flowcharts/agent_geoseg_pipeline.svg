<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111f"/>
      <stop offset="55%" stop-color="#0b1530"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#122440" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#00d4ff"/>
    </marker>
    <style>
      .title{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-size:54px;font-weight:700;fill:#f8fafc;letter-spacing:.5px}
      .subtitle{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-size:24px;fill:#a7c7d9;letter-spacing:.2px}
      .stepTitle{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-size:30px;font-weight:700;fill:#f8fafc}
      .stepText{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-size:20px;fill:#b7c6d6}
      .tag{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-size:18px;font-weight:700;fill:#06111f}
      .small{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-size:18px;fill:#9fb4c8}
      .num{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#08111f}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g opacity="0.22">
    <circle cx="1640" cy="130" r="260" fill="#00d4ff" opacity="0.18"/>
    <circle cx="250" cy="900" r="310" fill="#7c3aed" opacity="0.20"/>
    <path d="M0 820 C300 680 540 980 880 790 S1370 570 1920 750" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.35"/>
    <path d="M0 875 C350 735 530 1030 900 850 S1390 650 1920 820" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.28"/>
  </g>

  <text x="110" y="105" class="title">Agent + Image Recognition Pipeline</text>
  <text x="112" y="148" class="subtitle">从文献图像 / 反演结果图中自动识别地质分区与界面，并生成 SEM 正演建模输入</text>

  <g transform="translate(110,240)">
    <rect x="0" y="0" width="250" height="190" rx="28" fill="url(#card)" stroke="#1f3b5a" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="38" cy="38" r="19" fill="url(#accent)"/><text x="31" y="46" class="num">1</text>
    <text x="30" y="88" class="stepTitle">输入资料</text>
    <text x="30" y="125" class="stepText">PDF / 文献图片</text>
    <text x="30" y="154" class="stepText">概念模型 / 反演图</text>
  </g>
  <line x1="380" y1="335" x2="485" y2="335" stroke="#00d4ff" stroke-width="4" marker-end="url(#arrow)" opacity="0.95"/>

  <g transform="translate(505,240)">
    <rect x="0" y="0" width="250" height="190" rx="28" fill="url(#card)" stroke="#1f3b5a" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="38" cy="38" r="19" fill="url(#accent)"/><text x="31" y="46" class="num">2</text>
    <text x="30" y="88" class="stepTitle">Agent 理解</text>
    <text x="30" y="125" class="stepText">判断图像类型</text>
    <text x="30" y="154" class="stepText">规划处理步骤</text>
  </g>
  <line x1="775" y1="335" x2="880" y2="335" stroke="#00d4ff" stroke-width="4" marker-end="url(#arrow)" opacity="0.95"/>

  <g transform="translate(900,240)">
    <rect x="0" y="0" width="250" height="190" rx="28" fill="url(#card)" stroke="#1f3b5a" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="38" cy="38" r="19" fill="url(#accent)"/><text x="31" y="46" class="num">3</text>
    <text x="30" y="88" class="stepTitle">目标检测</text>
    <text x="30" y="125" class="stepText">Panel 裁剪</text>
    <text x="30" y="154" class="stepText">Colorbar / 坐标轴</text>
  </g>
  <line x1="1170" y1="335" x2="1275" y2="335" stroke="#00d4ff" stroke-width="4" marker-end="url(#arrow)" opacity="0.95"/>

  <g transform="translate(1295,240)">
    <rect x="0" y="0" width="250" height="190" rx="28" fill="url(#card)" stroke="#1f3b5a" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="38" cy="38" r="19" fill="url(#accent)"/><text x="31" y="46" class="num">4</text>
    <text x="30" y="88" class="stepTitle">图像预处理</text>
    <text x="30" y="125" class="stepText">去文字 / 去噪</text>
    <text x="30" y="154" class="stepText">颜色校正</text>
  </g>

  <line x1="1420" y1="450" x2="1420" y2="565" stroke="#00d4ff" stroke-width="4" marker-end="url(#arrow)" opacity="0.95"/>

  <g transform="translate(1295,590)">
    <rect x="0" y="0" width="250" height="190" rx="28" fill="url(#card)" stroke="#1f3b5a" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="38" cy="38" r="19" fill="url(#accent)"/><text x="31" y="46" class="num">5</text>
    <text x="30" y="88" class="stepTitle">分区识别</text>
    <text x="30" y="125" class="stepText">颜色聚类 / SLIC</text>
    <text x="30" y="154" class="stepText">区域融合 / 边界引导</text>
  </g>
  <line x1="1275" y1="685" x2="1170" y2="685" stroke="#00d4ff" stroke-width="4" marker-end="url(#arrow)" opacity="0.95"/>

  <g transform="translate(900,590)">
    <rect x="0" y="0" width="250" height="190" rx="28" fill="url(#card)" stroke="#1f3b5a" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="38" cy="38" r="19" fill="url(#accent)"/><text x="31" y="46" class="num">6</text>
    <text x="30" y="88" class="stepTitle">质量审查</text>
    <text x="30" y="125" class="stepText">Agent 视觉评估</text>
    <text x="30" y="154" class="stepText">失败重试 / 人工反馈</text>
  </g>
  <line x1="880" y1="685" x2="775" y2="685" stroke="#00d4ff" stroke-width="4" marker-end="url(#arrow)" opacity="0.95"/>

  <g transform="translate(505,590)">
    <rect x="0" y="0" width="250" height="190" rx="28" fill="url(#card)" stroke="#1f3b5a" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="38" cy="38" r="19" fill="url(#accent)"/><text x="31" y="46" class="num">7</text>
    <text x="30" y="88" class="stepTitle">界面提取</text>
    <text x="30" y="125" class="stepText">Label map → 边界</text>
    <text x="30" y="154" class="stepText">多边形 / 分区模型</text>
  </g>
  <line x1="485" y1="685" x2="380" y2="685" stroke="#00d4ff" stroke-width="4" marker-end="url(#arrow)" opacity="0.95"/>

  <g transform="translate(110,590)">
    <rect x="0" y="0" width="250" height="190" rx="28" fill="url(#card)" stroke="#1f3b5a" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="38" cy="38" r="19" fill="url(#accent)"/><text x="31" y="46" class="num">8</text>
    <text x="30" y="88" class="stepTitle">SEM 输入</text>
    <text x="30" y="125" class="stepText">速度 / 材料分区</text>
    <text x="30" y="154" class="stepText">SPECFEM 正演准备</text>
  </g>

  <g transform="translate(650,860)">
    <rect x="0" y="0" width="620" height="86" rx="43" fill="#00d4ff" opacity="0.14" stroke="#00d4ff" stroke-width="2"/>
    <text x="50" y="36" class="small">Human-in-the-loop：用户只在关键节点确认、修正或筛选代表性结果</text>
    <text x="50" y="65" class="small">Agent 将自然语言反馈转化为重分割、参数调整和质量审查动作</text>
  </g>

  <g transform="translate(1335,875)">
    <rect x="0" y="0" width="130" height="34" rx="17" fill="#00d4ff"/><text x="23" y="23" class="tag">Agent</text>
    <rect x="148" y="0" width="170" height="34" rx="17" fill="#ffb000"/><text x="22" y="23" class="tag">Computer Vision</text>
    <rect x="336" y="0" width="128" height="34" rx="17" fill="#a78bfa"/><text x="24" y="23" class="tag">SEM</text>
  </g>
</svg>
